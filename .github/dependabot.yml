# Dependency updates (spec ADR-0016).
#
# The pull requests it opens cite nothing — Dependabot composes its own commit
# message and offers no way to add a `Spec:` trailer. `spec_check.py` supplies
# `GOV-R12` for a pull request GitHub says `dependabot[bot]` opened (Q-R55).
#
# `.nvmrc` is not configured here: Dependabot has no manager that reads it — see
# the spec's 40-quality/tooling.md, "What Dependabot does not watch".
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Amsterdam
    labels: ["dependencies"]
    commit-message:
      prefix: chore
      include: scope
    # A release waits three days before it is offered. The shared gates are
    # excluded from that wait: a repo running a stale gate is the failure this
    # grouping exists to prevent. Security updates are never subject to cooldown.
    cooldown:
      default-days: 3
      exclude: ["lemonfiber/spec*"]
    groups:
      # First match wins, so the shared gates are claimed before the wildcard.
      shared-workflows:
        patterns: ["lemonfiber/spec*"]
      actions:
        patterns: ["*"]
        exclude-patterns: ["lemonfiber/spec*"]
        # Majors are left out, so each arrives on its own carrying `major`.
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Amsterdam
    labels: ["dependencies"]
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    cooldown:
      default-days: 3
    groups:
      # `@vitest/coverage-v8@X` declares an exact peer on `vitest@X`, so the two
      # are one upgrade: offered apart, neither resolves. First match wins, so the
      # pair is claimed before the wildcard.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"
        update-types: ["major", "minor", "patch"]
      npm:
        patterns: ["*"]
        # Majors are left out, so each arrives on its own carrying `major`.
        update-types: ["minor", "patch"]
