# Dependency updates (spec ADR-0016).
#
# The pull requests it opens cite nothing — Dependabot composes its own commit
# message and offers no way to add a `Spec:` trailer. `spec_check.py` supplies
# `GOV-R12` for a pull request GitHub says `dependabot[bot]` opened (Q-R55).
#
# `.nvmrc` is not configured here: Dependabot has no manager that reads it — see
# the spec's 40-quality/tooling.md, "What Dependabot does not watch".
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Amsterdam
    labels: ["dependencies"]
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 3
    # lemonfiber/spec's workflows are moved by the release train's one rolling
    # bump pull request (OPS-R85), never by this updater.
    ignore:
      - dependency-name: "lemonfiber/spec*"
    groups:
      actions:
        patterns: ["*"]
        # Majors are left out, so each arrives on its own carrying `major`.
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Amsterdam
    labels: ["dependencies"]
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    cooldown:
      default-days: 3
    # `typescript` is held below 7: `typescript-eslint`, which lints this
    # package, declares `typescript: >=4.8.4 <6.1.0` as its peer, so npm refuses
    # an install with 7. Its release that accepts 7 arrives as its own update,
    # and typescript moves with it in the same pull request.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # `@vitest/coverage-v8@X` declares an exact peer on `vitest@X`, so the two
      # are one upgrade: offered apart, neither resolves. First match wins, so the
      # pair is claimed before the wildcard.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"
        update-types: ["major", "minor", "patch"]
      npm:
        patterns: ["*"]
        # Majors are left out, so each arrives on its own carrying `major`.
        update-types: ["minor", "patch"]
