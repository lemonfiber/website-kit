# Keep this repo's labels in sync with the canonical set in the spec. The
# triage automations match labels by name, so a label that drifts is a rule
# that stops matching without going red.
name: labels
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"
permissions:
  contents: read
jobs:
  sync:
    permissions:
      contents: read
      issues: write
    uses: lemonfiber/spec/.github/workflows/label-sync.yml@d39729a2ee2b66266e3819465392abcd684f2feb # v1.0.53
