# Keep this repo's labels in sync with the canonical set in the spec. The
# triage automations match labels by name, so a label that drifts is a rule
# that stops matching without going red.
name: labels
on:
  workflow_dispatch:
  schedule:
    - cron: "56 4 * * 1"
permissions:
  contents: read
jobs:
  sync:
    permissions:
      contents: read
      issues: write
    uses: lemonfiber/spec/.github/workflows/label-sync.yml@98f21cb8a4db83cfc079c1a848d977818af80c70 # v1.0.115
