# Keep this repo's labels in sync with the canonical set in the spec. The
# triage automations match labels by name, so a label that drifts is a rule
# that stops matching without going red.
name: labels
on:
  workflow_dispatch:
  schedule:
    - cron: "56 4 * * 1"
permissions:
  contents: read
jobs:
  sync:
    permissions:
      contents: read
      issues: write
    uses: lemonfiber/spec/.github/workflows/label-sync.yml@2fc314fa018cfddfbd689bb78bf23e699806e180 # v1.0.124
