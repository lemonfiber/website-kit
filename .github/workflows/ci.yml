# The gates every repo in the org shares, kept in one place so improving one
# improves all of them. Pinned by commit, bumped deliberately.
name: ci

on: [pull_request]

permissions:
  contents: read

# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # `pull-requests: write` is what lets the gate close a pull request whose
  # citation is missing or names an identifier that does not exist, rather than
  # only going red at it. The workflow-level `contents: read` above is the
  # default for a job that declares nothing; a job-level block replaces that
  # default outright, so `contents: read` is restated here rather than inherited.
  spec-check:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@d39729a2ee2b66266e3819465392abcd684f2feb # v1.0.53
  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@d39729a2ee2b66266e3819465392abcd684f2feb # v1.0.53
  # Every pin this repository holds on a shared workflow, against what the spec's
  # default branch holds now. It fails naming the commits a pin has not taken; a
  # run that could not ask which they are says so rather than reporting clean.
  workflow-pins:
    uses: lemonfiber/spec/.github/workflows/workflow-pins.yml@ca6f4563337ae61c15af99c9b18436fd170781c1 # v1.0.51
  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@ca6f4563337ae61c15af99c9b18436fd170781c1 # v1.0.51
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@ca6f4563337ae61c15af99c9b18436fd170781c1 # v1.0.51
  attribution:
    uses: lemonfiber/spec/.github/workflows/attribution.yml@ca6f4563337ae61c15af99c9b18436fd170781c1 # v1.0.51
  commitlint:
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@ca6f4563337ae61c15af99c9b18436fd170781c1 # v1.0.51
  labeler:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@ca6f4563337ae61c15af99c9b18436fd170781c1 # v1.0.51
