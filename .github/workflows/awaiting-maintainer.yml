# The maintainer queue flag. Triggers are declared here because a reusable
# cannot declare its caller's; the behaviour lives in the spec repo. OPS-R26, OPS-R27.
#
# The list below is also the wait list. The flag only goes up once every check
# `main` requires has passed, and the reusable reads this list back out of this
# file to know what it must see finish first, so a workflow missing from it is
# one the gate never waits for, and nothing afterwards notices the pull request
# became mergeable. The checks `main` requires come from these workflows:
#
#   ci      spec-check / spec-check, dco / dco, commitlint / commitlint,
#           attribution / attribution, workflow-pins / workflow-pins,
#           hygiene / {actionlint, invite, lines, links, markdown, pins,
#           shared-files, typos}, security / {gitleaks, osv-scanner}
#   gate    gate
#   sonar   coverage, sonar, gate / gate
#   codeql  analyze (actions), analyze (javascript-typescript), alerts / alerts
#
# `SonarCloud Code Analysis` is required too and is posted by the SonarCloud app
# rather than by a workflow, so it cannot be waited for by name; `sonar`'s
# `gate / gate` reads that summary and cannot succeed before it exists. `gate`
# and `gate / gate` are different checks: `gate` is this repository's own, and
# `gate / gate` is the shared SonarCloud issue gate `sonar` calls. The
# `coverage` job runs the suite and the `sonar` job is the scan; the issue gate
# runs whatever they did, so it alone would pass either one failing.
#
# Add a workflow to branch protection and it belongs here in the same change.
name: awaiting-maintainer
on:
  workflow_run:
    workflows: [ci, gate, sonar, codeql]
    types: [completed]
  pull_request_review:
    types: [submitted]
  # Fork PRs carry a read-only token under `pull_request`, so the close event has
  # to run in the base repo's context to be able to edit a label at all.
  pull_request_target:
    types: [closed]
permissions:
  contents: read

jobs:
  awaiting:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/awaiting-maintainer.yml@ca6f4563337ae61c15af99c9b18436fd170781c1 # v1.0.51
    secrets:
      DISCORD_MAINTAINERS_WEBHOOK: ${{ secrets.DISCORD_MAINTAINERS_WEBHOOK }}
