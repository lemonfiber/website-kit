# Read by the SonarQube Cloud scan `sonar.yml` runs, which analyses this tree and
# reads the coverage report its `coverage` job wrote.
sonar.projectKey=lemonfiber_website-kit
sonar.organization=lemonfiber

# The suite sits beside what it tests, as `src/**/*.test.ts`, and is named as
# tests so the rules Sonar scopes to production code stay pointed at `src/` and
# `run/`. A file claimed as both source and test is indexed twice and the
# analysis produces nothing, so the suite is also excluded from the sources.
sonar.sources=src,run,scripts
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts

# `dist/` is what `npm run build` compiles `src/` and `run/` into, committed and
# held to the source by `npm run built`, so a finding there is a finding in the
# source it was built from. `scripts/no_open_codeql_alert.py` is the spec's
# shared gate, byte-identical to its home copy and analysed there.
sonar.exclusions=src/**/*.test.ts,dist/**,coverage/**,scripts/no_open_codeql_alert.py

sonar.sourceEncoding=UTF-8

# `run/` is the runners: they hand the rules in `src/` the process, the console,
# git and the forge, and are typed and linted rather than covered (REPO-R87).
# Coverage is measured on `src/`, which is held to 100%.
sonar.coverage.exclusions=run/**,scripts/**

# The coverage report is named by `sonar.yml`, which passes the scanner its path
# outside the workspace. It is written by `npm run coverage`, the run that holds
# `src/` to 100% line, branch, function and statement coverage.
